<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Productivity Space</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:"Poppins",sans-serif}
body{
  margin:0;
  background:linear-gradient(135deg,#0f1023,#1c1f3a);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

h1{text-align:center;margin:20px 0}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1f2340;
  border-radius:20px;
  padding:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.card h2{margin-bottom:10px}

input,textarea,button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  margin-bottom:10px;
}

textarea{resize:none}

button{
  background:#ff2d2d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{opacity:.9}

ul{list-style:none;padding:0;margin:0}
li{
  display:flex;
  align-items:center;
  gap:10px;
  background:#2a2f55;
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
}

/* Snow */
.snow{
  position:fixed;
  top:-10px;
  color:white;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translateY(110vh)}
}

/* Snake */
canvas{
  background:black;
  border-radius:15px;
  width:100%;
}
</style>
</head>

<body>

<h1 id="title">✨ Productivity Space ✨</h1>

<div class="container">

<!-- Sticky Notes -->
<div class="card">
  <h2>📝 Sticky Notes</h2>
  <textarea id="noteText" placeholder="Write a note..."></textarea>
  <button onclick="addNote()">Add Note</button>
  <ul id="notesList"></ul>
</div>

<!-- To Do -->
<div class="card">
  <h2>✅ To-Do</h2>
  <input id="todoInput" placeholder="New task">
  <button onclick="addTodo()">Add</button>
  <ul id="todoList"></ul>
</div>

<!-- Planner -->
<div class="card">
  <h2>📅 Planner</h2>
  <input id="planTime" placeholder="Time">
  <input id="planText" placeholder="Activity">
  <button onclick="addPlan()">Add</button>
  <ul id="planList"></ul>
</div>

<!-- Snake -->
<div class="card">
  <h2>🎮 Snake</h2>
  <canvas id="game" width="240" height="240"></canvas>
</div>

</div>

<!-- Music -->
<audio autoplay loop volume="0.2">
  <source src="https://cdn.pixabay.com/audio/2022/10/09/audio_5e7c8ef65f.mp3">
</audio>

<script>
/* NAME */
let name = localStorage.getItem("name");
if(!name){
  name = prompt("What is your name?");
  localStorage.setItem("name",name);
}
document.getElementById("title").innerText =
`✨ ${name}'s Productivity Space ✨`;

/* NOTES */
function addNote(){
  const text=document.getElementById("noteText").value;
  if(!text) return;
  const li=document.createElement("li");
  li.innerHTML=`<input type="checkbox"> ${text}`;
  document.getElementById("notesList").appendChild(li);
  document.getElementById("noteText").value="";
}

/* TODO */
function addTodo(){
  const text=document.getElementById("todoInput").value;
  if(!text) return;
  const li=document.createElement("li");
  li.innerHTML=`<input type="checkbox"> ${text}`;
  document.getElementById("todoList").appendChild(li);
  document.getElementById("todoInput").value="";
}

/* PLANNER */
function addPlan(){
  const t=document.getElementById("planTime").value;
  const a=document.getElementById("planText").value;
  if(!t||!a) return;
  const li=document.createElement("li");
  li.innerHTML=`<input type="checkbox"> <b>${t}</b> – ${a}`;
  document.getElementById("planList").appendChild(li);
  document.getElementById("planTime").value="";
  document.getElementById("planText").value="";
}

/* SNOW */
for(let i=0;i<30;i++){
  const s=document.createElement("div");
  s.className="snow";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=3+Math.random()*5+"s";
  s.innerText="❄";
  document.body.appendChild(s);
}

/* SNAKE GAME */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let snake=[{x:120,y:120}];
let dir={x:20,y:0};
let food={x:60,y:60};

function draw(){
  ctx.clearRect(0,0,240,240);
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,20,20);
  ctx.fillStyle="lime";
  snake.forEach(p=>ctx.fillRect(p.x,p.y,20,20));
}

function update(){
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=240||head.y>=240){
    alert("You are a snake 🐍");
    snake=[{x:120,y:120}];
    dir={x:20,y:0};
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    food={x:Math.floor(Math.random()*12)*20,
          y:Math.floor(Math.random()*12)*20};
  } else snake.pop();
  draw();
}
setInterval(update,200);

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp") dir={x:0,y:-20};
  if(e.key==="ArrowDown") dir={x:0,y:20};
  if(e.key==="ArrowLeft") dir={x:-20,y:0};
  if(e.key==="ArrowRight") dir={x:20,y:0};
});
</script>

</body>
</html>
