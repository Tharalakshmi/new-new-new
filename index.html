  animation:move 20s infinite alternate;
  opacity:.25;
  z-index:-2;
}
@keyframes move{
  to{transform:translate(100px,100px);}
}

<body>

<div class="container">

<h2>✅ To-Do</h2>

<script>
/* NAME */
let name = localStorage.getItem("name");
if(!name){
  name = prompt("What is your name?");
  localStorage.setItem("name",name);
let n = localStorage.name || prompt("What is your name?");
localStorage.name = n;
title.innerText = `✨ ${n}'s Productivity Space ✨`;

/* THEME */
function setAccent(c){
  document.documentElement.style.setProperty("--accent",c);
  localStorage.accent=c;
}
document.getElementById("title").innerText =
`✨ ${name}'s Productivity Space ✨`;
if(localStorage.accent)setAccent(localStorage.accent);

/* NOTES */
let notes = JSON.parse(localStorage.notes || "[]");

function addNote(){
  const text=document.getElementById("noteText").value;
  if(!text) return;
  const li=document.createElement("li");
  li.innerHTML=`<input type="checkbox"> ${text}`;
  document.getElementById("notesList").appendChild(li);
  document.getElementById("noteText").value="";
  if(!noteText.value) return;
  notes.push({ text: noteText.value, done:false });
  noteText.value="";
  saveNotes();
}

function saveNotes(){
  localStorage.notes = JSON.stringify(notes);
  renderNotes();
}

function renderNotes(){
  notesDiv.innerHTML="";
  notes.forEach((n,i)=>{
    let d=document.createElement("div");
    d.className="item"+(n.done?" done":"");

    let c=document.createElement("input");
    c.type="checkbox";
    c.checked=n.done;
    c.onchange=()=>{n.done=c.checked;saveNotes();};

    let s=document.createElement("span");
    s.innerText=n.text;

    d.append(c,s);
    notesDiv.appendChild(d);
  });
}
renderNotes();

/* TODO */
let todos = JSON.parse(localStorage.todos || "[]");

function addTodo(){
  const text=document.getElementById("todoInput").value;
  if(!text) return;
  const li=document.createElement("li");
  li.innerHTML=`<input type="checkbox"> ${text}`;
  document.getElementById("todoList").appendChild(li);
  document.getElementById("todoInput").value="";
  if(!todoInput.value) return;
  todos.push({ text: todoInput.value, done:false });
  todoInput.value="";
  saveTodos();
}

function saveTodos(){
  localStorage.todos = JSON.stringify(todos);
  renderTodos();
}

function renderTodos(){
  todoList.innerHTML="";
  todos.forEach((t,i)=>{
    let d=document.createElement("div");
    d.className="item"+(t.done?" done":"");

    let c=document.createElement("input");
    c.type="checkbox";
    c.checked=t.done;
    c.onchange=()=>{t.done=c.checked;saveTodos();};

    let s=document.createElement("span");
    s.innerText=t.text;

    d.append(c,s);
    todoList.appendChild(d);
  });
}
renderTodos();

/* PLANNER */
let plans = JSON.parse(localStorage.plans || "[]");

function addPlan(){
  const t=document.getElementById("planTime").value;
  const a=document.getElementById("planText").value;
  if(!t||!a) return;
  const li=document.createElement("li");
  li.innerHTML=`<input type="checkbox"> <b>${t}</b> – ${a}`;
  document.getElementById("planList").appendChild(li);
  document.getElementById("planTime").value="";
  document.getElementById("planText").value="";
  if(!timeInput.value || !activityInput.value) return;
  plans.push({ text:`${timeInput.value} – ${activityInput.value}`, done:false });
  timeInput.value=activityInput.value="";
  savePlans();
}

function savePlans(){
  localStorage.plans = JSON.stringify(plans);
  renderPlans();
}

function renderPlans(){
  plansDiv.innerHTML="";
  plans.forEach((p,i)=>{
    let d=document.createElement("div");
    d.className="item"+(p.done?" done":"");

    let c=document.createElement("input");
    c.type="checkbox";
    c.checked=p.done;
    c.onchange=()=>{p.done=c.checked;savePlans();};

    let s=document.createElement("span");
    s.innerText=p.text;

    d.append(c,s);
    plansDiv.appendChild(d);
  });
}
renderPlans();

/* SNOW */
for(let i=0;i<30;i++){
  const s=document.createElement("div");
  let s=document.createElement("div");
  s.className="snow";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=3+Math.random()*5+"s";
  s.innerText="❄";
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=10+Math.random()*20+"px";
  s.style.animationDuration=5+Math.random()*5+"s";
  document.body.appendChild(s);
}

/* SNAKE GAME */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let snake=[{x:120,y:120}];
let dir={x:20,y:0};
let food={x:60,y:60};
/* SNAKE */
const c=document.getElementById("game");
const ctx=c.getContext("2d");
let snake=[{x:100,y:100}],dx=20,dy=0,food={x:60,y:60};

function draw(){
  ctx.clearRect(0,0,240,240);
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,20,20);
  ctx.fillStyle="lime";
  snake.forEach(p=>ctx.fillRect(p.x,p.y,20,20));
}
document.addEventListener("keydown",e=>{
  if(e.key=="ArrowUp"){dx=0;dy=-20;}
  if(e.key=="ArrowDown"){dx=0;dy=20;}
  if(e.key=="ArrowLeft"){dx=-20;dy=0;}
  if(e.key=="ArrowRight"){dx=20;dy=0;}
});

function update(){
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=240||head.y>=240){
    alert("You are a snake 🐍");
    snake=[{x:120,y:120}];
    dir={x:20,y:0};
function game(){
  let h={x:snake[0].x+dx,y:snake[0].y+dy};
  if(h.x<0||h.y<0||h.x>=200||h.y>=200){
    gameText.innerText="🐍 You are a snake";
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    food={x:Math.floor(Math.random()*12)*20,
          y:Math.floor(Math.random()*12)*20};
  } else snake.pop();
  draw();
}
setInterval(update,200);
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){
    food={x:Math.floor(Math.random()*10)*20,y:Math.floor(Math.random()*10)*20};
  }else snake.pop();

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp") dir={x:0,y:-20};
  if(e.key==="ArrowDown") dir={x:0,y:20};
  if(e.key==="ArrowLeft") dir={x:-20,y:0};
  if(e.key==="ArrowRight") dir={x:20,y:0};
});
  ctx.clearRect(0,0,200,200);
  ctx.fillStyle="lime";
  snake.forEach(p=>ctx.fillRect(p.x,p.y,18,18));
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,18,18);

  setTimeout(game,200);
}
game();
</script>
