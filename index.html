<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Productivity Space</title>

<style>
:root{
  --accent:#b39ddb;
  --bg:#0f1020;
  --card:#1e1f3aee;
  --text:#ffffff;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:30px;
  overflow-x:hidden;
}

h1{text-align:center;margin-bottom:15px;}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:var(--card);
  backdrop-filter:blur(14px);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 40px rgba(179,157,219,.25);
}

textarea,input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  background:#2a2b55;
  padding:8px;
  border-radius:10px;
  margin-bottom:8px;
}

.item.done{
  opacity:.6;
  text-decoration:line-through;
}

/* Aurora */
.aurora{
  position:fixed;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at 30% 30%,#7f7fd5,transparent 40%),
    radial-gradient(circle at 70% 40%,#86a8e7,transparent 40%),
    radial-gradient(circle at 50% 70%,#91eae4,transparent 40%);
  animation:move 20s infinite alternate;
  opacity:.25;
  z-index:-2;
}
@keyframes move{
  to{transform:translate(100px,100px);}
}

/* Snow */
.snow{
  position:fixed;
  top:-10px;
  color:white;
  animation:fall linear infinite;
}
@keyframes fall{to{transform:translateY(110vh);}}

/* Snake */
canvas{
  background:black;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="aurora"></div>

<h1 id="title">✨ Productivity Space ✨</h1>

<div style="text-align:center;margin-bottom:15px">
  🎨 Theme Color:
  <input type="color" onchange="setAccent(this.value)">
</div>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2023/03/14/audio_4c3a02b5d1.mp3">
</audio>

<div class="container">

<!-- NOTES -->
<div class="card">
<h2>🗒️ Sticky Notes</h2>
<div id="notes"></div>
<textarea id="noteText" placeholder="Write a note..."></textarea>
<button onclick="addNote()">Add Note</button>
</div>

<!-- TODO -->
<div class="card">
<h2>✅ To-Do</h2>
<input id="todoInput" placeholder="New task...">
<button onclick="addTodo()">Add</button>
<div id="todoList"></div>
</div>

<!-- PLANNER -->
<div class="card">
<h2>📅 Planner</h2>
<input id="timeInput" placeholder="Time">
<input id="activityInput" placeholder="Activity">
<button onclick="addPlan()">Add</button>
<div id="plans"></div>
</div>

<!-- GAME -->
<div class="card">
<h2>🎮 Snake Game</h2>
<canvas id="game" width="200" height="200"></canvas>
<p id="gameText"></p>
</div>

</div>

<script>
/* NAME */
let n = localStorage.name || prompt("What is your name?");
localStorage.name = n;
title.innerText = `✨ ${n}'s Productivity Space ✨`;

/* THEME */
function setAccent(c){
  document.documentElement.style.setProperty("--accent",c);
  localStorage.accent=c;
}
if(localStorage.accent)setAccent(localStorage.accent);

/* NOTES */
let notes = JSON.parse(localStorage.notes || "[]");

function addNote(){
  if(!noteText.value) return;
  notes.push({ text: noteText.value, done:false });
  noteText.value="";
  saveNotes();
}

function saveNotes(){
  localStorage.notes = JSON.stringify(notes);
  renderNotes();
}

function renderNotes(){
  notesDiv.innerHTML="";
  notes.forEach((n,i)=>{
    let d=document.createElement("div");
    d.className="item"+(n.done?" done":"");

    let c=document.createElement("input");
    c.type="checkbox";
    c.checked=n.done;
    c.onchange=()=>{n.done=c.checked;saveNotes();};

    let s=document.createElement("span");
    s.innerText=n.text;

    d.append(c,s);
    notesDiv.appendChild(d);
  });
}
renderNotes();

/* TODO */
let todos = JSON.parse(localStorage.todos || "[]");

function addTodo(){
  if(!todoInput.value) return;
  todos.push({ text: todoInput.value, done:false });
  todoInput.value="";
  saveTodos();
}

function saveTodos(){
  localStorage.todos = JSON.stringify(todos);
  renderTodos();
}

function renderTodos(){
  todoList.innerHTML="";
  todos.forEach((t,i)=>{
    let d=document.createElement("div");
    d.className="item"+(t.done?" done":"");

    let c=document.createElement("input");
    c.type="checkbox";
    c.checked=t.done;
    c.onchange=()=>{t.done=c.checked;saveTodos();};

    let s=document.createElement("span");
    s.innerText=t.text;

    d.append(c,s);
    todoList.appendChild(d);
  });
}
renderTodos();

/* PLANNER */
let plans = JSON.parse(localStorage.plans || "[]");

function addPlan(){
  if(!timeInput.value || !activityInput.value) return;
  plans.push({ text:`${timeInput.value} – ${activityInput.value}`, done:false });
  timeInput.value=activityInput.value="";
  savePlans();
}

function savePlans(){
  localStorage.plans = JSON.stringify(plans);
  renderPlans();
}

function renderPlans(){
  plansDiv.innerHTML="";
  plans.forEach((p,i)=>{
    let d=document.createElement("div");
    d.className="item"+(p.done?" done":"");

    let c=document.createElement("input");
    c.type="checkbox";
    c.checked=p.done;
    c.onchange=()=>{p.done=c.checked;savePlans();};

    let s=document.createElement("span");
    s.innerText=p.text;

    d.append(c,s);
    plansDiv.appendChild(d);
  });
}
renderPlans();

/* SNOW */
for(let i=0;i<30;i++){
  let s=document.createElement("div");
  s.className="snow";
  s.innerText="❄";
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=10+Math.random()*20+"px";
  s.style.animationDuration=5+Math.random()*5+"s";
  document.body.appendChild(s);
}

/* SNAKE */
const c=document.getElementById("game");
const ctx=c.getContext("2d");
let snake=[{x:100,y:100}],dx=20,dy=0,food={x:60,y:60};

document.addEventListener("keydown",e=>{
  if(e.key=="ArrowUp"){dx=0;dy=-20;}
  if(e.key=="ArrowDown"){dx=0;dy=20;}
  if(e.key=="ArrowLeft"){dx=-20;dy=0;}
  if(e.key=="ArrowRight"){dx=20;dy=0;}
});

function game(){
  let h={x:snake[0].x+dx,y:snake[0].y+dy};
  if(h.x<0||h.y<0||h.x>=200||h.y>=200){
    gameText.innerText="🐍 You are a snake";
    return;
  }
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){
    food={x:Math.floor(Math.random()*10)*20,y:Math.floor(Math.random()*10)*20};
  }else snake.pop();

  ctx.clearRect(0,0,200,200);
  ctx.fillStyle="lime";
  snake.forEach(p=>ctx.fillRect(p.x,p.y,18,18));
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,18,18);

  setTimeout(game,200);
}
game();
</script>

</body>
</html>
